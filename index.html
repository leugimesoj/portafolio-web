<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style.css">
    <title>Miguel Ibañez | Frontend Developer</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 w-100">
    <div class="d-flex align-items-center justify-content-center w-100 position-relative" style="height: 75vh;">
      
      <!-- Card principal -->
      <div class="card w-25 h-100" >
        <img src="/assets/foto_cv_lc_es_11.jpg" class="card-img-top" alt="foto-cv">
        <div class="card-body d-flex flex-column align-items-center">
          <h5 class="card-title">Miguel Ibáñez</h5>
          <h6 class="card-text">Front-end Developer</h6>
          <div class="d-flex w-50 justify-content-around">
            <a class="icon-link">
              <i class="bi bi-github text-secondary"></i>
            </a>
            <a class="icon-link">
              <i class="bi bi-linkedin text-secondary"></i>
            </a>
          </div>
          <div class="pt-3"></div>
          <div class="d-flex w-100 border-top">
            <div class="w-50 border-end d-flex align-items-center justify-content-center">
              <a class="text-decoration-none icon-link-text text-dark">
                <i>Descargar CV</i>
              </a>
            </div>
            <div class="w-50 d-flex align-items-center justify-content-center">
              <a class="text-decoration-none icon-link-text text-dark">
                <i>Contactame</i>
              </a>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Carrusel -->
      <div class="w-50 bg-primary position-relative h-100" >
        <div id="carouselExample" class="carousel slide w-100 h-100 bg-secondary" data-bs-ride="false">
          <div class="carousel-inner h-100">
            
            
            <div class="carousel-item active h-100 w-100">
              <div class="card w-100 h-100">
                <div class="card-body">
                  <h5 class="card-title">Card 1</h5>
                  <p class="card-text">Este es un texto de ejemplo para la primera card.</p>
                  <a href="#" class="btn btn-primary">Ir a algo</a>
                </div>
              </div>
            </div>
  
            
            <div class="carousel-item h-100">
              <div class="card w-100 h-100">
                <div class="card-body">
                  <h5 class="card-title">Card 2</h5>
                  <p class="card-text">Texto para la segunda card.</p>
                  <a href="#" class="btn btn-primary">Ir a algo</a>
                </div>
              </div>
            </div>
  
            
            <div class="carousel-item h-100">
              <div class="card w-100 h-100">
                <div class="card-body">
                  <h5 class="card-title">Card 3</h5>
                  <p class="card-text">Texto para la tercera card.</p>
                  <a href="#" class="btn btn-primary">Ir a algo</a>
                </div>
              </div>
            </div>
  
          </div>
        </div>
  
        <!-- Botones carrusel alineados a la derecha -->
        <div class="position-absolute top-50 end-0 translate-middle-y d-flex flex-column gap-2 bg-primary">
          <button type="button" class="btn btn-light" data-bs-target="#carouselExample" data-bs-slide-to="0"></button>
          <button type="button" class="btn btn-light" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
          <button type="button" class="btn btn-light" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
        </div>
  
      </div>
  
    </div>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>

     
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
